# payment-service — deploys into the existing trains namespace
# Shares the postgres instance from booking-service (separate DB)
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: trains
type: Opaque
stringData:
  DATABASE_URL: "postgres://booking:changeme@postgres:5432/payments"  # ← match your password

---
# Init job: create the payments database if it doesn't exist
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-db-init
  namespace: trains
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16-alpine
          command: [sh, -c]
          args:
            - |
              PGPASSWORD=$PGPASSWORD psql -h postgres -U $PGUSER -d postgres \
                -c "SELECT 1 FROM pg_database WHERE datname='payments'" | grep -q 1 || \
              PGPASSWORD=$PGPASSWORD psql -h postgres -U $PGUSER -d postgres \
                -c "CREATE DATABASE payments;"
              PGPASSWORD=$PGPASSWORD psql -h postgres -U $PGUSER -d payments \
                -f /migrations/001_init.sql
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: payment-migrations

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-migrations
  namespace: trains
data:
  001_init.sql: |
    CREATE TABLE IF NOT EXISTS transactions (
        id            VARCHAR(36)   PRIMARY KEY,
        booking_ref   VARCHAR(12)   NOT NULL,
        amount_cad    NUMERIC(10,2) NOT NULL,
        card_brand    VARCHAR(20)   NOT NULL,
        card_last4    VARCHAR(4)    NOT NULL,
        processor_ref VARCHAR(64)   NOT NULL,
        status        VARCHAR(20)   NOT NULL DEFAULT 'success',
        created_at    TIMESTAMPTZ   NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_transactions_booking_ref ON transactions(booking_ref);
    CREATE INDEX IF NOT EXISTS idx_transactions_created_at  ON transactions(created_at DESC);

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: trains
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: [sh, -c, "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: payment-service
          image: harbor.srclos.net/trains/payment-service:latest
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: DATABASE_URL
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service.trains.svc.cluster.local"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: OTEL_EXPORTER_OTLP_HEADERS
            - name: OTEL_SERVICE_NAME
              value: payment-service
            - name: PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: trains
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8082
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service
  namespace: trains
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/hostname: payments.trains.srclos.net
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    - host: payments.trains.srclos.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  name: http
  tls:
    - hosts: [payments.trains.srclos.net]
      secretName: payment-service-tls
